name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  assemble-release-arm64:
    name: Assemble ARM64 Release (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: false

      - name: Assemble Release (arm64-v8a)
        run: ./gradlew assembleIntlRelease -Pwmkb.enableFdroid=true -Pwmkb.abi=arm64-v8a -Pwmkb.locales=en,vi -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: wmkeyboard-arm64-release
          path: app/build/outputs/apk/intl/release/*.apk
          retention-days: 14
